name: Agentcn focused brief components
on:
  push:
    branches: [main]
    paths: [.github/workflows/brief-components-checks.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_COMMIT: 6a3513353958fc02cc8f8dc08997e4a5f33d5ec7
  AGENTCN_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
jobs:
  focused-components:
    if: github.repository == 'alvarovillalbaa/agentcn-ui' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Guarded install, library generation and exact 42 cases
        shell: bash
        run: node scripts/run-brief-components-checks.mjs --source-commit "$SOURCE_COMMIT"
